<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Biblioteca de fotos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="terax.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#abe7dd}a:hover{color:#f3f6fa}
</style>
</helmet>
<div class="tx-root android" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 40px 0 0; background: radial-gradient(130% 260px at 50% 0%, var(--glow) 0%, var(--bg) 100%), var(--bg); background-repeat: no-repeat;">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 12px 0 20px;">
    <img src="/_blob/9f2c0fcfd4186b307185bfb8c405152b" alt="terax" style="height: 26px; width: auto; display: block;">
    <button aria-label="Ajustes y equipos" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: transparent; color: var(--text-muted); display: grid; place-items: center; cursor: pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <a href="AndroidEquipos.dc.html" style="margin: 4px 16px 0; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 12px 8px 10px; border-radius: 18px; background: var(--surface); text-decoration: none; color: var(--text);">
    <span style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: var(--icon-container); border: 2px solid var(--icon-ring); color: var(--icon-on-container); display: grid; place-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <span style="font-size: 12px; line-height: 16px; color: var(--text-muted);">Enviar a</span>
      <span style="font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">PC de casa</span>
    </span>
    <span style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--mint); color: var(--mint); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>
      Cerca
    </span>
  </a>

  <div style="margin: 12px 16px 0; display: flex; gap: 8px; align-items: center;">
    <div role="tablist" aria-label="Biblioteca" style="flex: 1; display: flex; height: 44px; padding: 3px; border-radius: 999px; background: var(--surface);">
      <button role="tab" aria-selected="true" style="flex: 1; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
        Fotos
      </button>
      <a href="AndroidDocumentos.dc.html" role="tab" aria-selected="false" style="flex: 1; border-radius: 999px; color: var(--text); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
        Documentos
      </a>
    </div>
    <button aria-label="Buscar fotos por nombre" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 999px; background: var(--surface); color: var(--text-muted); display: grid; place-items: center; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 18px 16px 0;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px;">
      <span style="font-size: 13px; line-height: 18px; font-weight: 600;">Hoy</span>
      <span style="font-size: 12px; line-height: 16px; color: var(--text-muted);">Recientes primero</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 4px;">
      <sc-for list="{{photos}}" as="p" hint-placeholder-count="12">
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
          <div style="aspect-ratio: 1 / 1; border-radius: 10px; background: {{p.tone}}; position: relative; overflow: hidden;">
            <sc-if value="{{p.shot}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; left: 30%; right: 30%; top: 8%; bottom: 8%; border-radius: 6px; background: rgba(255,255,255,.18);"></span>
            </sc-if>
          </div>
          <span style="font-size: 11px; line-height: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.name}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; align-items: center; gap: 10px; padding: 12px 8px 12px 16px; border-radius: 16px; background: #1f2a36; border: 1px solid var(--outline);">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--mint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    <span style="flex: 1; font-size: 13px; line-height: 18px;">Mantén presionada una foto y llévala arriba. O tócala para verla.</span>
    <button aria-label="Entendido, ocultar ayuda" style="width: 40px; height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--text-muted); display: grid; place-items: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = ['#4b5a6b','#6b5c49','#2f4256','#56634a','#3d4b5a','#71604d','#2c3a48','#5a6875','#4a4f5c','#665a50','#38495a','#55606b'];
    const names = ['IMG_20261028_101522.jpg','Screenshot_20261028_0954.png','IMG_20261028_093310.jpg','IMG_20261028_090741.jpg','IMG_20261028_085902.jpg','Screenshot_20261028_0812.png','IMG_20261027_221400.jpg','IMG_20261027_204511.jpg','IMG_20261027_190025.jpg','IMG_20261027_183140.jpg','Screenshot_20261027_1710.png','IMG_20261027_162233.jpg'];
    return { photos: names.map((n, i) => ({ name: n, tone: tones[i], shot: n.indexOf('Screenshot') === 0 })) };
  }
}
</script>
</body>
</html>
