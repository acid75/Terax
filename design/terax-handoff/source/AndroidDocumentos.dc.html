<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Documentos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="terax.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="tx-root android" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; padding-top: 40px; background: radial-gradient(130% 260px at 50% 0%, var(--glow) 0%, var(--bg) 100%), var(--bg); background-repeat: no-repeat;">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 12px 0 20px;">
    <img src="/_blob/9f2c0fcfd4186b307185bfb8c405152b" alt="terax" style="height: 26px; width: auto; display: block;">
    <a href="AndroidEquipos.dc.html" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: var(--surface); color: var(--text); text-decoration: none; font-size: 13px; font-weight: 600;">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: var(--mint);"></span>
      PC de casa · Cerca
    </a>
  </header>

  <div style="margin: 8px 16px 0; display: flex; gap: 8px; align-items: center;">
    <div role="tablist" aria-label="Biblioteca" style="flex: 1; display: flex; height: 44px; padding: 3px; border-radius: 999px; background: var(--surface);">
      <a href="Main.dc.html" role="tab" aria-selected="false" style="flex: 1; border-radius: 999px; color: var(--text); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
        Fotos
      </a>
      <button role="tab" aria-selected="true" style="flex: 1; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
        Documentos
      </button>
    </div>
    <button aria-label="Buscar archivos por nombre" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 999px; background: var(--surface); color: var(--text-muted); display: grid; place-items: center; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </div>

  <div style="margin: 14px 0 0; padding: 0 16px; display: flex; gap: 8px; overflow: hidden;">
    <button style="height: 36px; padding: 0 14px; border: 1px solid var(--outline); border-radius: 999px; background: transparent; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;">Descargas</button>
    <button aria-pressed="true" style="height: 36px; padding: 0 14px; border: 1px solid var(--mint); border-radius: 999px; background: rgba(171,231,221,.12); color: var(--mint); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;">Trabajo</button>
    <button style="height: 36px; padding: 0 12px; border: 1px solid var(--outline); border-radius: 999px; background: transparent; font-size: 13px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 6px; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      WhatsApp · volver a autorizar
    </button>
  </div>

  <nav aria-label="Ubicación" style="margin: 14px 16px 4px; display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 18px;">
    <button aria-label="Carpeta anterior" style="width: 36px; height: 36px; border: 0; border-radius: 999px; background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer; margin-left: -8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <span style="color: var(--text-muted);">Trabajo</span>
    <span style="color: var(--text-muted);">›</span>
    <span style="font-weight: 600;">Facturas</span>
  </nav>

  <ul style="list-style: none; margin: 0; padding: 0 8px; display: flex; flex-direction: column;">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
      <li style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px; border-radius: 14px;">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--surface); display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: {{it.badgeColor}};">{{it.badge}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
          <span style="font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{it.nameColor}};">{{it.name}}</span>
          <span style="font-size: 12px; line-height: 16px; color: {{it.metaColor}};">{{it.meta}}</span>
        </span>
        <span aria-hidden="true" style="color: var(--text-muted); font-size: 18px;">{{it.trail}}</span>
      </li>
    </sc-for>
  </ul>

  <span style="position: absolute; left: 0; right: 0; bottom: 32px; text-align: center; font-size: 13px; line-height: 18px; color: var(--text-muted);">Mantén presionado un archivo y llévalo arriba</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const m = 'var(--text-muted)', t = 'var(--text)', d = 'var(--danger)';
    const rows = [
      ['2026', 'Carpeta · 14 elementos', 'DIR', '›', m, t, m],
      ['2025', 'Carpeta · 38 elementos', 'DIR', '›', m, t, m],
      ['Factura_octubre_2026.pdf', 'PDF · 412 KB · hoy', 'PDF', '', t, t, m],
      ['Cotización cliente — versión final revisada.docx', 'Word · 88 KB · ayer', 'DOC', '', t, t, m],
      ['Gastos_trimestre.xlsx', 'Excel · 1.2 MB · 24 oct', 'XLS', '', t, t, m],
      ['Notas reunión.md', 'Markdown · 3 KB · 20 oct', 'MD', '', t, t, m],
      ['Contrato_firmado.pdf', 'Ya no está en el teléfono', 'PDF', '', m, m, d]
    ];
    return { items: rows.map(r => ({ name: r[0], meta: r[1], badge: r[2], trail: r[3], badgeColor: r[4], nameColor: r[5], metaColor: r[6] })) };
  }
}
</script>
</body>
</html>
