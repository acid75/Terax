<style>html,body{margin:0;background:var(--bg)}.pv{padding:16px;display:flex;flex-direction:column;gap:12px}</style>

  <div class="tx-sheet" role="dialog" aria-label="Tus equipos">
    <div class="tx-sheet-handle"></div>
    <div class="tx-sheet-head"><span class="tx-sheet-title">Tus equipos</span><button class="tx-iconbtn" aria-label="Cerrar"><span class="tx-icon lg">close</span></button></div>
    <button class="tx-link" style="margin-left:4px"><span class="tx-icon" aria-hidden="true">add</span>Conectar equipo</button>
